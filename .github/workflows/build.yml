name: Build Multi-Platform DLLs

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false


jobs:
  Build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false  # Continue other jobs if one matrix fail
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild (Windows)
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v2

      # - name: Setup CUDA (optional) # trop long et version à vérifier
      #   run: choco install cuda -y

      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: '**/vcpkg.json'

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1

      - name: Install OpenMP (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install llvm libomp
          echo "Check for omp.h:"
          find /opt/homebrew -name omp.h || true
          echo "LDFLAGS=-L/opt/homebrew/opt/libomp/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I/opt/homebrew/opt/libomp/include" >> $GITHUB_ENV
          echo "CXXFLAGS=-Xpreprocessor -fopenmp -I/opt/homebrew/opt/libomp/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=/opt/homebrew/opt/libomp/lib" >> $GITHUB_ENV

      - name: Configure CMake with vcpkg toolchain
        run: >
          cmake -B build -S .
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="$CXXFLAGS" -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS"

      - name: Build CPU
        run: cmake --build build --target CPU --config Release

      - name: Create Output folder and copy Windows binaries
        if: matrix.os == 'windows-latest'
        run: |
          copy build\Release\CPU.dll Output\

      - name: Create Output folder (Unix/macOS)
        if: matrix.os != 'windows-latest'
        run: mkdir -p Output && cp build/lib*.so* Output/ || true && cp build/lib*.dylib* Output/ || true

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-libs-${{ matrix.os }}
          path: Output/*

      - name: Build test_cpu (Windows only)
        if: matrix.os == 'windows-latest'
        run: cmake --build build --target test_cpu --config Release

      - name: Run Google Tests (Windows only)
        if: matrix.os == 'windows-latest'
        run: .\build\Release\test_cpu.exe || true

  Documentation:
    name: Generate & Deploy Doxygen Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Generate Doxygen Documentation
        run: doxygen Doxyfile

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload documentation to GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Docs/html/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
