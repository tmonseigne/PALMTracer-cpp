name: Build Multi-Platform DLLs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write
  checks: write

concurrency:
  group: "pages"
  cancel-in-progress: false


jobs:
  Build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false  # Continue other jobs if one matrix fail
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # ---------- Dépendances ----------
      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: '**/vcpkg.json'

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Install OpenMP (macOS)
        if: matrix.os == 'macos-latest'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install --formula llvm libomp
          echo "Check for omp.h:"
          find /opt/homebrew -name omp.h || true
          echo "LDFLAGS=-L/opt/homebrew/opt/libomp/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I/opt/homebrew/opt/libomp/include" >> $GITHUB_ENV
          echo "CXXFLAGS=-Xpreprocessor -fopenmp -I/opt/homebrew/opt/libomp/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=/opt/homebrew/opt/libomp/lib" >> $GITHUB_ENV

      - name: Configure CMake with vcpkg toolchain
        run: >
          cmake -B build -S .
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_BUILD_TYPE=Release

       # ---------- Build ----------
      - name: Build CPU
        run: cmake --build build --target CPU --config Release

      - name: Create Output folder and copy Windows binaries
        if: matrix.os == 'windows-latest'
        run: |
          copy build\Release\CPU.dll Output\

      - name: Create Output folder (Unix/macOS)
        if: matrix.os != 'windows-latest'
        run: mkdir -p Output && cp build/lib*.so* Output/ || true && cp build/lib*.dylib* Output/ || true

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v7
        with:
          name: compiled-libs-${{ matrix.os }}
          path: Output/*

      # ---------- Tests ----------
      - name: Build test_cpu
        run: cmake --build build --target test_cpu --config Release

      - name: Run tests (ctest)
        working-directory: build
        run: ctest -C Release -V --output-junit=ctest-report.xml

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: build/ctest-report.xml
          if-no-files-found: warn

  Documentation:
    name: Generate & Deploy Doxygen Docs
    needs: Build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz cloc

      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: out/test-reports

      - name: Generate test report
        run: python3 Docs/tools/junit_to_markdown.py out/test-reports/*/*.xml --output Docs/reports/test_report.md

      - name: Generate Doxygen Documentation
        run: doxygen Doxyfile

      - name: Compute LOC badge (git-tracked files only)
        run: |
          git ls-files | cloc --json --list-file=- --out=cloc_raw.json --exclude-dir=input,output --exclude-ext=json,html,xml,csv

          python3 - << 'PY'
          import json, pathlib

          raw = json.load(open("cloc_raw.json", encoding="utf-8"))
          s = raw["SUM"]
          message = f"files {int(s['nFiles'])} | comment {int(s['comment'])} | code {int(s['code'])}"
          print("CLOC Summary:", message)
          badge = { "schemaVersion": 1, "label": "CLOC SUM", "message": message, "color": "blue"}

          out = pathlib.Path("Docs/html/cloc.json")
          out.write_text(json.dumps(badge), encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload documentation to GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'Docs/html/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
